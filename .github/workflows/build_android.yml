name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Download and install export templates + Android build template
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

          # Install the Android build template into the project (required for Gradle)
          # The android_source.zip lives inside the templates
          if [ -f /tmp/templates/templates/android_source.zip ]; then
            mkdir -p android
            unzip -q /tmp/templates/templates/android_source.zip -d android/
            # Godot expects the structure under android/build
            if [ -d android/build ]; then
              echo "Android build template installed"
            else
              # some versions put contents directly
              ls -la android/
            fi
          else
            echo "android_source.zip not found in templates"
            find /tmp/templates -name "*android*" || true
          fi

      - name: Create export_presets.cfg
        run: |
          cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/DTM.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/export_format=0
          gradle_build/min_sdk="24"
          gradle_build/target_sdk="34"
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="0.1.0"
          package/unique_name="com.dtm.racing"
          package/name="DTM"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          permissions/access_network_state=true
          permissions/internet=true
          EOF

      - name: Setup debug keystore
        run: |
          mkdir -p build
          keytool -genkeypair -v -keystore build/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=DTM Debug,O=DTM,C=US"

      - name: Export APK
        run: |
          mkdir -p build
          # First let Godot import the project
          ./godot --headless --path . --editor --quit-after 3 2>&1 || true
          # Now export
          ./godot --headless --path . --export-debug "Android" build/DTM.apk 2>&1
          echo "=== build dir ==="
          ls -lh build/ || true
          find . -name "*.apk" -ls || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DTM-APK
          path: |
            build/*.apk
            **/*.apk
          if-no-files-found: warn

      - name: Create Release (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/DTM.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
